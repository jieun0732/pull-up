spring:
  application:
    name: pull-up

  config:
    import:
      - optional:classpath:${spring.application.name}-local.yml
      - optional:file:${spring.application.name}-server.yml

  datasource:
    driver-class-name: ${database.jdbc-driver}
    url: jdbc:${database.provider}://${database.ip}:${database.port}/${database.schema}?serverTimeZone=${database.timezone}
    username: ${database.username}
    password: ${database.password}

  # jpa
  jpa:
    hibernate:
      ddl-auto: ${jpa.ddl-auto}
    properties:
      hibernate:
        dialect: ${jpa.dialect}
        default_batch_fetch_size: ${jpa.batch-fetch}
        format_sql: ${jpa.format-sql}


  # social security
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${oauth2.kakao.client-id}
            client-secret: ${oauth2.kakao.client-secret}
            redirect-uri: ${oauth2.kakao.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: kakao
            scope:
              - profile_nickname
          apple:
            client-id: ${oauth2.apple.client-id}
            redirect-uri: ${oauth2.apple.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: form_post
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          apple:
            authorizationUri: https://appleid.apple.com/auth/authorize?response_mode=form_post&response_type=code%20id_token
            tokenUri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys

# custom auth config
auth:
  kakao:
    frontend-redirect-uri: ${oauth2.kakao.frontend-redirect-uri}
  apple:
    frontend-redirect-uri: ${oauth2.apple.frontend-redirect-uri}
    token:
      key-path: ${oauth2.apple.token.key-path}
      key-id: ${oauth2.apple.token.key-id}
      team-id: ${oauth2.apple.token.team-id}
      base-uri: ${oauth2.apple.token.base-uri}
      expire: ${oauth2.apple.token.expire}
  jwt:
    key: ${jwt.key}
    subject: ${jwt.subject}
    issuer: ${jwt.issuer}
    audience: ${jwt.audience}
    expire: ${jwt.expire}

#logging
logging:
  level:
    org.hibernate.SQL: ${log.level.jpa}
    root: ${log.level.root}