<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="nav">
    <nav class="navbar bg-body-tertiary">
        <div class="ms-5 d-flex justify-content-start gap-3">
            <button onclick="location.href='/admin'" type="button" class="btn btn-outline-black">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-house-fill" viewBox="0 0 16 16">
                    <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
                    <path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>
                </svg>
            </button>
            <button onclick="location.href='/admin/problems'" type="button" class="btn"
                    th:classappend="${navBtnColor == 'problems'? 'btn btn-primary' : 'btn btn-outline-primary'}">문제 관리</button>
            <button onclick="location.href='/admin/examsheets'" type="button" class="btn"
                    th:classappend="${navBtnColor == 'examsheets'? 'btn btn-warning' : 'btn btn-outline-warning'}">시험지 관리</button>
            <button onclick="location.href='/admin/exams'" type="button" class="btn"
                    th:classappend="${navBtnColor == 'exams'? 'btn btn-danger' : 'btn btn-outline-danger'}">시험 관리</button>
            <button onclick="location.href='/admin/members'" type="button" class="btn"
                    th:classappend="${navBtnColor == 'members'? 'btn btn-success' : 'btn btn-outline-success'}">사용자 관리</button>
        </div>
    </nav>
</div>

</body>

</html>
