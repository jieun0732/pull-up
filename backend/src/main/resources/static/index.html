<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Demo</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width" />
    <base href="/" />
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/css/bootstrap.min.css" />
    <script type="text/javascript" src="/webjars/bootstrap/js/bootstrap.min.js"></script>
  </head>
  <body>
    <h1>SNS Login Test</h1>
    <div class="container unauthenticated">
      With Kakao: <a href="/oauth2/authorization/kakao">click here</a>
      <br>
      With Apple: <a href="/oauth2/authorization/apple">click here</a>
      <br>
      get Fetch with token(local): <a href="javascript:getFetchTest(localBaseUrl)" >click here</a>
      <br>
      get Fetch with token(server): <a href="javascript:getFetchTest(serverBaseUrl)" >click here</a>
    </div>
    <div class="container authenticated" style="display: none">Logged in as: <span id="user"></span></div>
    <script type="text/javascript">
      const localBaseUrl = "http://localhost:8080";
      const serverBaseUrl = "https://pullup-api.shop";
      async function getFetchTest(baseUrl) {
        const params = new URLSearchParams(location.search);
        const response = await fetch(baseUrl + "/api/pull-up/examLS/incorrect-answerLS/1?memberId=" + params.get("memberId"), {
          method: "GET",
          mode: "cors",
          headers: {
            "Content-Type": "application/json"
          }
        });
        const jsonData = await response.json();
        console.log(jsonData);
      }
    </script>
  </body>
</html>
