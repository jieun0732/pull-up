<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Demo</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width" />
    <base href="/" />
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/css/bootstrap.min.css" />
    <script type="text/javascript" src="/webjars/bootstrap/js/bootstrap.min.js"></script>
  </head>
  <body>
    <h1>SNS Login Test</h1>
    <div class="container unauthenticated">
      With Kakao: <a href="/oauth2/authorization/kakao">click here</a>
      <br>
      With Apple: <a href="/oauth2/authorization/apple">click here</a>
      <br>
      Local Login: <a href="javascript:postLocalLogin(localBaseUrl)">click here</a>
      <br>
      get Solved Info: <a href="javascript:getSolvedInfo(localBaseUrl)">click here</a>
      <br>
    </div>
    <div class="container authenticated" style="display: none">Logged in as: <span id="user"></span></div>
    <script type="text/javascript">
      const localBaseUrl = "http://localhost:3000";
      const serverBaseUrl = "https://pullup-api.shop";
      let memberId;

      async function postLocalLogin(baseUrl) {
        const response = await fetch(baseUrl + "/api/oauth2/callback/local", {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "application/json"
          }
        });
        const jsonData = await response.json();
        console.log(jsonData);
        memberId = jsonData.memberId
      }

      async function getSolvedInfo(baseUrl) {
        const response = await fetch(baseUrl + "/api/exams/solved?memberId=" + memberId + "&entry=MATH")
      }
    </script>
  </body>
</html>
