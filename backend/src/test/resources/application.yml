server:

  servlet:
    encoding:
      charset: UTF-8
      force: true
spring:
  application:
    name: pull-up

  config:
    import:
      - optional:classpath:${spring.application.name}-config.yml

  datasource:
    driver-class-name: ${database.jdbc-driver}
    url: jdbc:${database.provider}://${database.ip}:${database.port}/${database.schema}?serverTimeZone=${database.timezone}
    username: ${database.username}
    password: ${database.password}

  jpa:
    hibernate:
      ddl-auto: ${jpa.ddl-auto}
    properties:
      hibernate:
        dialect: ${jpa.dialect}
        default_batch_fetch_size: ${jpa.batch-fetch}
        format_sql: ${jpa.format-sql}

  # social security
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test client id
            client-secret: test client secret
            redirect-uri: localhost:8080
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: kakao
            scope:
              - profile_nickname
          apple:
            client-id: test client id
            redirect-uri: localhost:8080
            authorization-grant-type: authorization_code
            client-authentication-method: form_post
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          apple:
            authorizationUri: https://appleid.apple.com/auth/authorize?response_mode=form_post&response_type=code%20id_token
            tokenUri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys

# custom auth config
auth:
  kakao:
    frontend-redirect-uri: localhost:8080
  apple:
    frontend-redirect-uri: localhost:8080
    token:
      key-path: /
      key-id: test key id
      team-id: test team id
      base-uri: https://appleid.apple.com
      expire: 3600
  local:
    frontend-redirect-uri: localhost:3000
  jwt:
    key: bvTAyAcnI3j1NPxTfJh9KLhBLQrrKdoS
    subject: test subject
    issuer: test issuer
    audience: test audience
    expire: 1234554321
  cookie:
    domain: http://localhost:8080
    path: /
    max-age: 1234
  domain:
    frontend: http://localhost:8080
    backend: http://localhost:8080
  with-credential: false
  admin:
    id: test
    password: 1234

springdoc:
  use-fqn: true

#logging
logging:
  level:
    root: DEBUG